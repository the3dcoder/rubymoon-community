<?xml version="1.0" encoding="UTF-8"?>
<!-- cm.example.shapes: square, 112x112, 1-bit. A dotted square with a thick outline. CC0-1.0. -->
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
  <defs>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
      <rect width="2" height="2" fill="#000"/>
    </pattern>
  </defs>
  <rect x="16" y="16" width="80" height="80" fill="url(#dots)" stroke="#000" stroke-width="6" stroke-linejoin="miter"/>
</svg>
