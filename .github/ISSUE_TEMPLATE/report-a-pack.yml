name: Something's not right in a pack
description: A wrong fact, an unfair question, a picture that's hard to see, or a typo.
title: "Problem in "
body:
  - type: markdown
    attributes:
      value: |
        **Is it about a child's safety?** A real person or a photo of a person in a picture, personal details, something unsafe or
        upsetting, or your work shared without permission: please don't post it here. Report it privately
        instead, with the [Report a vulnerability](https://github.com/the3dcoder/rubymoon-community/security/advisories/new)
        form. Only the reviewers see it.

        For everything else, this is the right place. Thank you for helping.
  - type: input
    id: pack
    attributes:
      label: Pack id
      placeholder: cm.robin.farm-sounds
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
  - type: input
    id: item
    attributes:
      label: Item or picture
      placeholder: find-cow
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Please describe it in words; no photos of children.
    validations:
      required: true
